# 動作確認用（手動または scripts/probe.py を直したときだけ動く）
name: probe
on:
  push:
    branches: [main]
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/probe.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f data/debug
          git commit -m "動作確認の結果" || echo "変更なし"
          git pull --rebase
          git push
